[project]
name = "etabli-api"
version = "0.1.0"
description = "API du MVP Établi, gestion de garage automobile"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = [
  "S101",   # assert autorisé dans les tests
  "RUF001", # caractères typographiques français (’, «, »)
  "RUF002",
  "RUF003",
  "B008",   # Depends() dans les signatures FastAPI
]

[tool.ruff.lint.isort]
# Le dossier local alembic/ contient les migrations ; le paquet alembic reste tiers.
known-third-party = ["alembic"]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py"]
